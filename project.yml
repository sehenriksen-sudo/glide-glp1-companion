name: GlideGLP1Companion

options:
  bundleIdPrefix: com.glide
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # ← fill in your Apple Team ID
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: "5.0.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:

  # ── Main app ──────────────────────────────────────────────────────────────
  GlideGLP1Companion:
    type: application
    platform: iOS
    sources:
      - path: GlideGLP1Companion
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glide.app
        PRODUCT_NAME: Glide
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: GlideGLP1Companion/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        NSHealthShareUsageDescription: "Glide reads your workout data to track your exercise habits on your GLP-1 journey."
        NSHealthUpdateUsageDescription: "Glide writes workout sessions back to Apple Health."
        NSPhotoLibraryUsageDescription: "Glide uses your photo library to set your community profile picture."
        NSUserActivityTypes:
          - CSSearchableItemActionType
        BGTaskSchedulerPermittedIdentifiers:
          - com.glide.refresh
          - com.glide.healthkit
        UIBackgroundModes:
          - fetch
          - remote-notification
          - processing
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - glide
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
    entitlements:
      path: GlideGLP1Companion/GlideGLP1Companion.entitlements
      properties:
        com.apple.developer.healthkit: true
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.glide.shared
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - target: GlideWidget
        embed: true
        codeSign: true

  # ── Widget + Live Activity extension ─────────────────────────────────────
  GlideWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GlideWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glide.app.widget
        PRODUCT_NAME: GlideWidget
        SKIP_INSTALL: YES
    info:
      path: GlideWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GlideWidget/GlideWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.glide.shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
